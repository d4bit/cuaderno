      var thumb = '<a class="thumb" style="--c:' + COLOR[ep[0]] + '" href="' + url(id0) + '" target="_blank" rel="noopener" aria-label="Ver capítulo ' + ep[1] + '">' + (img ? '<img src="' + img + '" alt="" loading="lazy">' : '<span class="t">T' + ep[0] + '</span><span class="n num">' + ep[1] + '</span>' + NOTE) + '</a>';
      var parts = ep[2].length > 1 ? '<span class="parts">' + ep[2].map(function (id, i) { return '<a href="' + url(id) + '" target="_blank" rel="noopener">Parte ' + (i + 1) + '</a>'; }).join('') + '</span>' : '<small>Temporada ' + ep[0] + '</small>';
      return '<li class="ep' + (v ? ' visto' : '') + (nx && k(nx) === k(ep) ? ' next' : '') + '" id="ep-' + k(ep) + '">' + thumb
        + '<div class="info"><a class="tit" href="' + url(id0) + '" target="_blank" rel="noopener">Capítulo ' + ep[1] + '</a>' + parts + '</div>'
        + '<button type="button" class="check" data-k="' + k(ep) + '" aria-pressed="' + v + '" aria-label="' + (v ? 'Visto. Tocar para desmarcar' : 'Marcar como visto') + '">' + CHECK + '</button></li>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-t]');
    if (t) { temp = +t.dataset.t; save(); render(); window.scrollTo({ top: 0 }); return; }
    var c = e.target.closest('.check');
    if (c) { var key = c.dataset.k; if (vistos[key]) delete vistos[key]; else vistos[key] = 1; save(); render(); return; }
    if (e.target.closest('#subir')) {
      var nx = siguiente(); if (!nx) return;
      if (nx[0] !== temp) { temp = nx[0]; save(); render(); }
      var el = document.getElementById('ep-' + k(nx)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  render();
})();
</script>
</body>
</html>
