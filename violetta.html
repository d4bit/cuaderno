      sg.innerHTML = '<span class="txt"><small>' + (nv ? 'Seguir viendo' : 'Empezar') + '</small><b>Temporada ' + nx[0] + ' · Capítulo ' + nx[1] + '</b>' + (nx[2].length > 1 ? '<small>En ' + nx[2].length + ' partes</small>' : '') + '</span><span class="play" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';
    } else sg.hidden = true;

    document.getElementById('tabs').innerHTML = [1, 2, 3].map(function (t) {
      var eps = EPS.filter(function (ep) { return ep[0] === t; }), v = eps.filter(function (ep) { return vistos[k(ep)]; }).length;
      return '<button type="button" data-t="' + t + '" aria-pressed="' + (t === temp) + '">Temporada ' + t + '<small class="num">' + v + '/' + eps.length + '</small></button>';
    }).join('');
    var eps = EPS.filter(function (ep) { return ep[0] === temp; }), vt = eps.filter(function (ep) { return vistos[k(ep)]; }).length;
    document.getElementById('bar').style.width = (eps.length ? vt / eps.length * 100 : 0) + '%';
    document.getElementById('cuenta').textContent = vt + ' de ' + eps.length + ' vistos';
    document.getElementById('list').innerHTML = eps.map(function (ep) {
      var id0 = ep[2][0], v = !!vistos[k(ep)], img = IMGS[id0];
      var thumb = '<a class="thumb" style="--c:' + COLOR[ep[0]] + '" href="' + url(id0) + '" target="_blank" rel="noopener" aria-label="Ver capítulo ' + ep[1] + '">' + (img ? '<img src="' + img + '" alt="" loading="lazy">' : '<span class="t">T' + ep[0] + '</span><span class="n num">' + ep[1] + '</span>' + NOTE) + '</a>';
      var parts = ep[2].length > 1 ? '<span class="parts">' + ep[2].map(function (id, i) { return '<a href="' + url(id) + '" target="_blank" rel="noopener">Parte ' + (i + 1) + '</a>'; }).join('') + '</span>' : '<small>Temporada ' + ep[0] + '</small>';
      return '<li class="ep' + (v ? ' visto' : '') + (nx && k(nx) === k(ep) ? ' next' : '') + '" id="ep-' + k(ep) + '">' + thumb
        + '<div class="info"><a class="tit" href="' + url(id0) + '" target="_blank" rel="noopener">Capítulo ' + ep[1] + '</a>' + parts + '</div>'
        + '<button type="button" class="check" data-k="' + k(ep) + '" aria-pressed="' + v + '" aria-label="' + (v ? 'Visto. Tocar para desmarcar' : 'Marcar como visto') + '">' + CHECK + '</button></li>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-t]');
    if (t) { temp = +t.dataset.t; save(); render(); window.scrollTo({ top: 0 }); return; }
    var c = e.target.closest('.check');
    if (c) { var key = c.dataset.k; if (vistos[key]) delete vistos[key]; else vistos[key] = 1; save(); render(); return; }
    if (e.target.closest('#subir')) {
      var nx = siguiente(); if (!nx) return;
      if (nx[0] !== temp) { temp = nx[0]; save(); render(); }
      var el = document.getElementById('ep-' + k(nx)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  // Al abrir: ir a la temporada del primer capítulo sin ver y bajar hasta él
  var nx0 = siguiente(); if (nx0) temp = nx0[0];
  render();
  if (nx0) setTimeout(function () {
    var el = document.getElementById('ep-' + k(nx0));
    if (el) el.scrollIntoView({ behavior: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  }, 250);
})();
</script>
</body>
</html>
